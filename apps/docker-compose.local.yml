name: aicloud-local

services:
  rds-postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: aicare
      POSTGRES_USER: aicloud
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - aicloud_rds_pg_data:/var/lib/postgresql/data

  onprem-postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: onprem
      POSTGRES_USER: onprem
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - aicloud_onprem_pg_data:/var/lib/postgresql/data

  onprem-sensitive-api:
    image: aicloud/onprem-sensitive-api:local
    build:
      context: ./onprem-sensitive-api
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://onprem@onprem-postgres:5432/onprem
    ports:
      - "9000:9000"
    depends_on:
      - onprem-postgres

  auth-user-service:
    image: aicloud/auth-user-service:local
    build:
      context: ./auth-user-service
    environment:
      APP_ENV: dev
      PORT: 3001
      DATABASE_URL: postgresql://aicloud@rds-postgres:5432/aicare
      ONPREM_API_BASE_URL: http://onprem-sensitive-api:9000
      ONPREM_API_TIMEOUT_MS: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      - rds-postgres
      - onprem-sensitive-api

  questionnaire-service:
    image: aicloud/questionnaire-service:local
    build:
      context: ./questionnaire-service
    environment:
      APP_ENV: dev
      PORT: 3002
      DATABASE_URL: postgresql://aicloud@rds-postgres:5432/aicare
      ONPREM_API_BASE_URL: http://onprem-sensitive-api:9000
      ONPREM_API_TIMEOUT_MS: 3000
      SQS_TRIAGE_QUEUE_URL: ""
      AWS_REGION: ap-northeast-2
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      - rds-postgres
      - onprem-sensitive-api

  ai-triage-service:
    image: aicloud/ai-triage-service:local
    build:
      context: ./ai-triage-service
    environment:
      APP_ENV: dev
      PORT: 3003
      DATABASE_URL: postgresql://aicloud@rds-postgres:5432/aicare
      S3_REPORT_PREFIX: reports/
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3003:3003"
    depends_on:
      - rds-postgres

  board-service:
    image: aicloud/board-service:local
    build:
      context: ./board-service
    environment:
      APP_ENV: dev
      PORT: 3004
      DATABASE_URL: postgresql://aicloud@rds-postgres:5432/aicare
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3004:3004"
    depends_on:
      - rds-postgres

  hospital-recommendation-service:
    image: aicloud/hospital-recommendation-service:local
    build:
      context: ./hospital-recommendation-service
    environment:
      APP_ENV: dev
      PORT: 3005
      MAP_API_PROVIDER: mock
      MAP_API_KEY: ""
      MAP_API_BASE_URL: https://dapi.kakao.com
      MAP_API_TIMEOUT_MS: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3005:3005"

  frontend:
    image: aicloud/frontend:local
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - auth-user-service
      - questionnaire-service
      - ai-triage-service
      - board-service
      - hospital-recommendation-service

volumes:
  aicloud_rds_pg_data:
  aicloud_onprem_pg_data:
