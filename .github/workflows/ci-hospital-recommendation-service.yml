name: CI - hospital-recommendation-service

on:
  push:
    branches: [ "**" ]
    paths:
      - 'apps/hospital-recommendation-service/**' # ⭐ Hospital Recommendation Service 코드가 바뀔 때만 실행!
      - '.github/workflows/ci-hospital-recommendation-service.yml'
  workflow_dispatch: # 👈 이거 한 줄 추가! (수동 실행 버튼 생성)

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hospital-recommendation-service
  EKS_CLUSTER_NAME: ai-care-dev-eks
  K8S_NAMESPACE: service

# OIDC 토큰 발급을 위한 권한 설정 (필수)
permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

# Node.js / TypeScript / React Native Lint 검사 (Placeholder)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Run Lint (TS/RN) Placeholder
      run: echo "Run Lint here - 프론트/백엔드 팀이 TypeScript(ESLint) 세팅 후 명령어 수정 예정"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::105959916837:role/github-actions-workflow-role # 🚨 나중에 인프라 담당자에게 받아서 채울 부분
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    - name: Ensure hospital map API secret
      env:
        MAP_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: |
        if [ -z "$MAP_API_KEY" ]; then
          echo "GitHub secret KAKAO_REST_API_KEY is not set. Skipping Kubernetes Secret update."
          echo "Hospital search will use the existing Kubernetes Secret if one already exists, otherwise it will fall back to mock results."
          exit 0
        fi

        aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

        kubectl -n "$K8S_NAMESPACE" create secret generic hospital-recommendation-service-secret \
          --from-literal=MAP_API_KEY="$MAP_API_KEY" \
          --from-literal=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Build and Push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd apps/hospital-recommendation-service
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        # ... (기존 docker push 단계) ...

    # 1. Kustomize 설치
    - name: Setup Kustomize
      uses: imranismail/setup-kustomize@v2

    # 2. 새 이미지 태그로 매니페스트 업데이트
    - name: Update Kubernetes resources
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd manifests/overlays/dev/hospital-recommendation-service
        # Kustomize를 이용해 deployment.yaml의 이미지 주소를 새 버전으로 덮어씁니다.
        kustomize edit set image 105959916837.dkr.ecr.ap-northeast-2.amazonaws.com/hospital-recommendation-service:latest=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # 3. 변경된 K8s 설정 파일을 Git에 자동 커밋 & 푸시
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase origin ${{ github.ref_name }}
        
        # 🚨 hospital-recommendation-service 전용 경로 적용 완료!
        git add manifests/overlays/dev/hospital-recommendation-service/kustomization.yaml
        
        # 만약 커밋할 내용이 없으면 에러 내지 말고 넘어가도록 안전장치 추가
        git commit -m "chore: update hospital-recommendation-service image tag to ${{ github.sha }}" || echo "No changes"

        # 현재 실행 중인 브랜치로 안전하게 Push!
        git push origin HEAD:${{ github.ref_name }} || (
          git pull --rebase origin ${{ github.ref_name }} &&
          git push origin HEAD:${{ github.ref_name }}
        )
