# Local development only.
# The password/secret values below are non-production placeholders for local Docker Compose runs.
# Do not copy these values to AWS, Kubernetes, GitHub Secrets, or any shared environment.

name: aicloud-local-dev

x-common-env: &common-env
  APP_ENV: local
  LOG_LEVEL: INFO
  TZ: Asia/Seoul
  JWT_SECRET: local_jwt_secret_change_me
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

x-rds-env: &rds-env
  RDS_HOST: rds-postgres-local
  RDS_PORT: 5432
  RDS_DB_NAME: aicare
  RDS_USERNAME: dbadmin
  RDS_PASSWORD: local_rds_password_change_me
  DATABASE_URL: postgresql://dbadmin:local_rds_password_change_me@rds-postgres-local:5432/aicare

x-node-dev: &node-dev
  image: node:22-alpine
  networks:
    - aicloud-local

x-node-dev-command: &node-dev-command >
  sh -c "npm install --no-audit --no-fund && npm run start:dev"

services:
  rds-postgres-local:
    image: postgres:17
    environment:
      POSTGRES_DB: aicare
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: local_rds_password_change_me
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d aicare"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rds_postgres_local_data:/var/lib/postgresql/data
    networks:
      - aicloud-local

  onprem-postgres-local:
    image: postgres:17
    environment:
      POSTGRES_DB: sensitive_aicare
      POSTGRES_USER: secure_admin
      POSTGRES_PASSWORD: local_onprem_password_change_me
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_admin -d sensitive_aicare"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - onprem_postgres_local_data:/var/lib/postgresql/data
    networks:
      - aicloud-local

  # Applies the local aggregate RDS schema once.
  # Service-level Prisma schemas are partial views; pushing them sequentially can remove
  # tables owned by other services in this shared local database.
  # No SQL init files are mounted because packages/database/sql/rds/001_init.sql is not present.
  rds-schema-init:
    <<: *node-dev
    working_dir: /workspace
    environment:
      <<: [*common-env, *rds-env]
    command: >
      sh -c "
        npx --yes prisma@6.18.0 db push --skip-generate --schema=/workspace/local-rds-schema/prisma/schema.prisma
      "
    volumes:
      - ./apps/local-rds-schema:/workspace/local-rds-schema
    depends_on:
      rds-postgres-local:
        condition: service_healthy

  onprem-sensitive-api:
    image: python:3.12-slim
    working_dir: /app
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      TZ: Asia/Seoul
      PORT: 9000
      ONPREM_DB_HOST: onprem-postgres-local
      ONPREM_DB_PORT: 5432
      ONPREM_DB_NAME: sensitive_aicare
      ONPREM_DB_USERNAME: secure_admin
      ONPREM_DB_PASSWORD: local_onprem_password_change_me
      DATABASE_URL: postgresql://secure_admin:local_onprem_password_change_me@onprem-postgres-local:5432/sensitive_aicare
      FIELD_ENCRYPTION_KEY: local_dev_field_encryption_key_change_me
      HEALTH_CHECK_PATH: /health
      DB_HEALTH_CHECK_PATH: /db-health
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"
    volumes:
      - ./apps/onprem-sensitive-api:/app
    depends_on:
      onprem-postgres-local:
        condition: service_healthy
    networks:
      - aicloud-local

  auth-user-service:
    <<: *node-dev
    working_dir: /app
    environment:
      <<: [*common-env, *rds-env]
      PORT: 3001
      ONPREM_API_BASE_URL: http://onprem-sensitive-api:9000
      ONPREM_API_TIMEOUT_MS: 3000
    command: *node-dev-command
    ports:
      - "3001:3001"
    volumes:
      - ./apps/auth-user-service:/app
      - /app/node_modules
    depends_on:
      rds-schema-init:
        condition: service_completed_successfully
      onprem-sensitive-api:
        condition: service_started

  questionnaire-service:
    <<: *node-dev
    working_dir: /app
    environment:
      <<: [*common-env, *rds-env]
      PORT: 3002
      ONPREM_API_BASE_URL: http://onprem-sensitive-api:9000
      ONPREM_API_TIMEOUT_MS: 3000
      AWS_REGION: ap-northeast-2
      SQS_TRIAGE_QUEUE_URL: ""
    command: *node-dev-command
    ports:
      - "3002:3002"
    volumes:
      - ./apps/questionnaire-service:/app
      - /app/node_modules
    depends_on:
      rds-schema-init:
        condition: service_completed_successfully
      onprem-sensitive-api:
        condition: service_started

  ai-triage-service:
    <<: *node-dev
    working_dir: /app
    environment:
      <<: [*common-env, *rds-env]
      PORT: 3003
      AI_PROVIDER: mock
      BEDROCK_MODEL_ID: ""
      SQS_TRIAGE_QUEUE_URL: ""
      S3_BUCKET_NAME: local-reports
      S3_REPORT_PREFIX: reports/
    command: *node-dev-command
    ports:
      - "3003:3003"
    volumes:
      - ./apps/ai-triage-service:/app
      - /app/node_modules
    depends_on:
      rds-schema-init:
        condition: service_completed_successfully

  board-service:
    <<: *node-dev
    working_dir: /app
    environment:
      <<: [*common-env, *rds-env]
      PORT: 3004
      S3_BUCKET_NAME: local-reports
      S3_REPORT_PREFIX: reports/
    command: *node-dev-command
    ports:
      - "3004:3004"
    volumes:
      - ./apps/board-service:/app
      - /app/node_modules
    depends_on:
      rds-schema-init:
        condition: service_completed_successfully

  hospital-recommendation-service:
    <<: *node-dev
    working_dir: /app
    environment:
      <<: *common-env
      PORT: 3005
      MAP_API_PROVIDER: mock
      MAP_API_KEY: ""
      MAP_API_BASE_URL: https://dapi.kakao.com
      MAP_API_TIMEOUT_MS: 3000
    command: >
      sh -c "mkdir -p /tmp/hospital-runtime &&
             cp package.json package-lock.json /tmp/hospital-runtime/ &&
             cd /tmp/hospital-runtime &&
             npm install --omit=dev --no-audit --no-fund &&
             npm install --no-save ts-node@10.9.2 typescript@5.7.3 tsconfig-paths@4.2.0 --no-audit --no-fund &&
             cd /app &&
             TS_NODE_TRANSPILE_ONLY=true NODE_PATH=/tmp/hospital-runtime/node_modules node -r /tmp/hospital-runtime/node_modules/ts-node/register -r /tmp/hospital-runtime/node_modules/tsconfig-paths/register src/main.ts"
    ports:
      - "3005:3005"
    volumes:
      - ./apps/hospital-recommendation-service:/app

  frontend:
    image: nginx:1.27-alpine
    environment:
      VITE_AUTH_API_BASE_URL: http://localhost:3001
      VITE_QUESTIONNAIRE_API_BASE_URL: http://localhost:3002
      VITE_AI_API_BASE_URL: http://localhost:3003
      VITE_BOARD_API_BASE_URL: http://localhost:3004
      VITE_HOSPITAL_API_BASE_URL: http://localhost:3005
    ports:
      - "5173:80"
    volumes:
      - ./apps/frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth-user-service
      - questionnaire-service
      - ai-triage-service
      - board-service
      - hospital-recommendation-service
    networks:
      - aicloud-local

networks:
  aicloud-local:
    driver: bridge

volumes:
  rds_postgres_local_data:
  onprem_postgres_local_data:
