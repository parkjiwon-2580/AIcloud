apiVersion: v1
kind: Service
metadata:
  name: ai-triage-service
  namespace: service
  labels:
    app: ai-triage-service
    app.kubernetes.io/name: ai-triage-service
    app.kubernetes.io/part-of: ai-care
    app.kubernetes.io/component: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: ai-triage-service
  ports:
    - protocol: TCP
      port: 80           # 인그레스나 다른 서비스들이 이 서비스에 접근할 포트
      targetPort: 8080   # 파드 내부 컨테이너 포트 (8080)
  type: ClusterIP        # 내부 통신용 IP만 할당 (ALB Ingress와 연동)
