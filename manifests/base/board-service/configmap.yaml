apiVersion: v1
kind: ConfigMap
metadata:
  name: board-service-config
  namespace: service
  labels:
    app: board-service
    app.kubernetes.io/name: board-service
    app.kubernetes.io/part-of: ai-care
    app.kubernetes.io/component: backend
data:
  APP_ENV: "dev"
  PORT: "8080"
  SERVICE_NAME: "board-service"
  LOG_LEVEL: "INFO"
  TZ: "Asia/Seoul"
  AWS_REGION: "ap-northeast-2"
  # 실제 S3 인프라 설정 반영
  S3_BUCKET_NAME: "ai-care-dev-image-105959916837"
  S3_BUCKET_REGION: "ap-northeast-2"
  S3_BOARD_IMAGE_PREFIX: "board-images/"
  S3_PRESIGNED_URL_EXPIRE_SECONDS: "300"
  # 실제 RDS 인프라 설정 반영 (DB 이름: aicare)
  RDS_HOST: "ai-care-dev-postgres.czeumgqsmwh8.ap-northeast-2.rds.amazonaws.com"
  RDS_PORT: "5432"
  RDS_DB_NAME: "aicare"
  RDS_USERNAME: "dbadmin"
  RDS_SSL: "true"
  RDS_SSL_REJECT_UNAUTHORIZED: "false"
  # CORS 설정
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://k8s-service-frontend-beae8ff31e-1731686725.ap-northeast-2.elb.amazonaws.com,https://k8s-service-frontend-beae8ff31e-1731686725.ap-northeast-2.elb.amazonaws.com"
