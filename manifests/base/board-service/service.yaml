apiVersion: v1
kind: Service
metadata:
  name: board-service
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: board-service
  ports:
    - protocol: TCP
      port: 80          # 서비스가 노출할 포트
      targetPort: 8080    # 파드 컨테이너 내부의 포트 (containerPort와 일치)
  type: ClusterIP