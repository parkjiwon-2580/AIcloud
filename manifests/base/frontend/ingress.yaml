apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]' 
spec:
  ingressClassName: alb
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  rules:
    - http:
        paths:
          # ------------------------------------------------
          # 1. 프론트엔드 연결 (기본 경로)
          # ------------------------------------------------
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # ------------------------------------------------
          # 2. 백엔드 5개 마이크로서비스 라우팅 규칙 추가
          # ------------------------------------------------
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-user-service   # 👈 정확한 서비스 이름 매칭
                port:
                  number: 8080            # 👈 컨테이너 포트 8080과 매칭

          - path: /api/board
            pathType: Prefix
            backend:
              service:
                name: board-service
                port:
                  number: 8080

          - path: /api/triage
            pathType: Prefix
            backend:
              service:
                name: ai-triage-service
                port:
                  number: 8080

          - path: /api/hospital
            pathType: Prefix
            backend:
              service:
                name: hospital-recommendation-service
                port:
                  number: 8080

          - path: /api/questionnaire
            pathType: Prefix
            backend:
              service:
                name: questionnaire-service
                port:
                  number: 8080