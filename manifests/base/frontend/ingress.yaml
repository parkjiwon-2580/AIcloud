apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]' 
spec:
  ingressClassName: alb
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  rules:
    - host: ai-care-dev.local  # 👈 여기에 가상 도메인을 명시하여 인프라 설정을 정석으로 맞춥니다.
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-user-service
                port:
                  number: 80
          - path: /api/board
            pathType: Prefix
            backend:
              service:
                name: board-service
                port:
                  number: 80
          - path: /api/triage
            pathType: Prefix
            backend:
              service:
                name: ai-triage-service
                port:
                  number: 80
          - path: /api/hospital
            pathType: Prefix
            backend:
              service:
                name: hospital-recommendation-service
                port:
                  number: 80
          - path: /api/questionnaire
            pathType: Prefix
            backend:
              service:
                name: questionnaire-service
                port:
                  number: 80