apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 👈 ALB가 80번 포트를 리스닝하도록 명시적으로 지정
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]' 
spec:
  ingressClassName: alb
  # 👈 핵심 수정 부분 1: 기존 Fixed 404를 없애고, 리스너의 기본 동작을 frontend 연결로 바꿉니다!
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  # 👈 핵심 수정 부분 2: 명시적인 Path 규칙 생성
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80