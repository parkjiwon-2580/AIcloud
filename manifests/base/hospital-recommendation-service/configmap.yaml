apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-recommendation-service-config
data:
  APP_ENV: "dev"
  PORT: "8080"
  SERVICE_NAME: "hospital-recommendation-service"
  LOG_LEVEL: "INFO"
  TZ: "Asia/Seoul"
  AWS_REGION: "ap-northeast-2"
  # 실제 S3 인프라 설정 반영
  S3_BUCKET_NAME: "ai-care-dev-reports-105959916837"
  S3_BOARD_IMAGE_PREFIX: "reports/"
  S3_PRESIGNED_URL_EXPIRE_SECONDS: "300"
  # 실제 RDS 인프라 설정 반영 (DB 이름: aicare)
  RDS_HOST: "ai-care-dev-postgres.czeumgqsmwh8.ap-northeast-2.rds.amazonaws.com"
  RDS_PORT: "5432"
  RDS_DB_NAME: "aicare"
  RDS_USERNAME: "dbadmin"
  # CORS 설정
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"