apiVersion: apps/v1
kind: Deployment
metadata:
  name: questionnaire-service
  namespace: service
  labels:
    app: questionnaire-service
    app.kubernetes.io/name: questionnaire-service
    app.kubernetes.io/part-of: ai-care
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: questionnaire-service
  template:
    metadata:
      labels:
        app: questionnaire-service
        app.kubernetes.io/name: questionnaire-service
        app.kubernetes.io/part-of: ai-care
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: questionnaire-service
        image: 105959916837.dkr.ecr.ap-northeast-2.amazonaws.com/questionnaire-service:latest # 나중에 치환될 부분
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: questionnaire-service-config
        - secretRef:
            name: questionnaire-service-secret
      volumes:
      - name: tmp
        emptyDir: {}
