apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: questionnaire-service-network-policy
  namespace: service
  labels:
    app: questionnaire-service
    app.kubernetes.io/name: questionnaire-service
    app.kubernetes.io/part-of: ai-care
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app: questionnaire-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 9000
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - protocol: TCP
      port: 443
