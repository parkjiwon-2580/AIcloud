apiVersion: v1
kind: Service
metadata:
  name: questionnaire-service
  namespace: service
  labels:
    app: questionnaire-service
    app.kubernetes.io/name: questionnaire-service
    app.kubernetes.io/part-of: ai-care
    app.kubernetes.io/component: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  selector:
    app: questionnaire-service
  ports:
    - protocol: TCP
      port: 80          # 인그레스나 타 서비스가 접근할 포트
      targetPort: 8080    # 파드 컨테이너 내부 포트 (containerPort와 일치)
  type: ClusterIP         # 클러스터 내부 통신용 IP 설정
